{% extends 'layout/app-layout.html' %}
{% block 'content' %}

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', sans-serif;
    overflow-x: hidden;
    background: black;
    color: white;
}

.hero-container {
    position: relative;
    height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.hero-overlay {
    background: rgba(0, 0, 0, 0.7);
    position: absolute;
    height: 100%;
    width: 100%;
    top: 0;
    left: 0;
}

.movie-info-card {
    position: absolute;
    top: 50%;
    left: 5%;
    transform: translateY(-50%);
    z-index: 2;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 40px;
    backdrop-filter: blur(10px);
    max-width: 600px;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
    animation: fadeInUp 1.2s ease forwards;
    opacity: 0;
}

@keyframes fadeInUp {
    0% {
        opacity: 0;
        transform: translateY(30px);
    }
    100% {
        opacity: 1;
        transform: translateY(-50%);
    }
}

.movie-info-card h1 {
    font-size: 3.2rem;
    font-weight: 800;
    margin-bottom: 15px;
    color: #fff;
}

.movie-info-card p {
    font-size: 1.1rem;
    color: #ddd;
}

.meta-data {
    margin-top: 20px;
    font-size: 1rem;
    color: #ccc;
}

.btn-watch {
    margin-top: 30px;
    padding: 15px 30px;
    font-size: 1.2rem;
    font-weight: bold;
    background: linear-gradient(135deg, #ff004f, #ff9900);
    border: none;
    border-radius: 50px;
    color: white;
    box-shadow: 0 0 15px #ff004f;
    transition: transform 0.3s ease;
    text-decoration: none;
    display: inline-block;
}

.btn-watch:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px #ff004f;
}

.trailer-section {
    margin-top: 10vh;
    background: black;
    padding: 30px 20px;
    text-align: center;
}

.trailer-wrapper {
    max-width: 900px;
    margin: 0 auto;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 0 25px rgba(255, 0, 79, 0.3);
}
</style>

<div class="hero-container" style="background-image: url('{{movie.thumbnail.url}}');">
    <div class="hero-overlay"></div>

    <div class="movie-info-card">
        <h1>{{movie.title}}</h1>
        <p>{{movie.description}}</p>
        <div class="meta-data">
        </div>
        <a href="#trailer" class="btn-watch">▶ Watch Now</a>
    </div>
</div>

<div class="trailer-section">
    <div class="trailer-wrapper" id="trailer">
        <video controls width="100%">
          <source src="{{movie.video.url}}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
</div>

{% endblock %}
